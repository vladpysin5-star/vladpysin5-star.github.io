<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Kotoba</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f9d8a"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f2f6f5;--c:#fff;--tx:#15302b;--mu:#6a7e79;--ac:#0f9d8a;--a2:#dff4f0;--bd:#dce6e3;--ok:#1f9d55;--no:#d64545;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not(.light){--bg:#0f1917;--c:#172524;--tx:#e6f1ee;--mu:#8fa6a0;--a2:#12413c;--bd:#27403b;color-scheme:dark}}
:root.dark{--bg:#0f1917;--c:#172524;--tx:#e6f1ee;--mu:#8fa6a0;--a2:#12413c;--bd:#27403b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;padding-bottom:90px}
main{max-width:640px;margin:0 auto;padding:8px 14px}header{display:flex;justify-content:space-between;max-width:640px;margin:0 auto;padding:10px 14px 0}
h2{margin:8px 0}.card{background:var(--c);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:10px 0}.center{text-align:center}.big{font-size:34px;font-weight:700;margin:8px 0}.mu{color:var(--mu);font-size:14px}
button,select,input,textarea{font:inherit;color:var(--tx)}input,select,textarea{background:var(--c);border:1px solid var(--bd);border-radius:12px;padding:11px;width:100%;margin:4px 0}
.btn,.btn2,.opt,.g{display:block;width:100%;border:0;border-radius:14px;padding:14px;margin:8px 0;font-weight:600;cursor:pointer}.btn{background:var(--ac);color:#fff}.btn2{background:var(--a2);color:var(--ac)}
.opt{background:var(--c);border:1.5px solid var(--bd);text-align:left}.opt.ok{border-color:var(--ok);background:rgba(31,157,85,.15)}.opt.no{border-color:var(--no);background:rgba(214,69,69,.15);animation:sh .3s}.opt.sel{border-color:var(--ac)}.opt:disabled{opacity:1}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ic{background:var(--c);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;cursor:pointer}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>.btn{flex:0 0 56px;margin:4px 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tile{background:var(--c);border:1px solid var(--bd);border-radius:14px;padding:10px;text-align:center}.tile b{display:block;font-size:22px;color:var(--ac)}
.grades{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.g{color:#fff;margin:0}.g small{display:block;font-weight:400;opacity:.9}.g0{background:#d64545}.g1{background:#e08a1e}.g2{background:#0f9d8a}.g3{background:#2f7de1}
.item{display:flex;justify-content:space-between;gap:8px;background:var(--c);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:6px 0;cursor:pointer}.item div{display:flex;flex-direction:column}
.badge{font-size:12px;background:var(--a2);color:var(--ac);border-radius:9px;padding:2px 8px;align-self:center;white-space:nowrap}.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ac)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--c);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}nav button{flex:1;background:0;border:0;font-size:11px;color:var(--mu);padding:6px 0}nav button span{display:block;font-size:22px}nav .on{color:var(--ac);font-weight:700}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9;display:flex;align-items:flex-end;justify-content:center}.md{background:var(--bg);width:100%;max-width:640px;max-height:88%;overflow:auto;border-radius:22px 22px 0 0;padding:16px calc(16px) calc(16px + env(safe-area-inset-bottom,0px))}
.fb{border-radius:14px;padding:12px;margin:8px 0}.fb.ok{background:rgba(31,157,85,.15)}.fb.no{background:rgba(214,69,69,.15)}.tok{display:inline-block;width:auto;margin:4px;padding:8px 12px}
#t{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;background:#222;color:#fff;border-radius:12px;padding:10px 16px;opacity:0;transition:.3s;z-index:20;pointer-events:none;max-width:90%}
rt{font-size:.5em;font-weight:400}.fo rt{display:none}.ft ruby:not(.sh) rt{visibility:hidden}ruby{cursor:pointer}.warn{background:#fdecc8;color:#5a3c00;border-radius:12px;padding:8px 12px;margin:8px 0;font-size:14px}.pairs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pairs .opt{margin:0}.pairs .opt.done{visibility:hidden}.bars{display:flex;gap:6px;align-items:flex-end;height:90px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mu)}.bars i{display:block;background:var(--ac);border-radius:5px 5px 0 0}
</style></head><body><div id="app"></div><div id="t"></div>
<script>
const SEED={ja:`食べる|たべる|есть|глагол|毎日[まいにち]ご飯[はん]を食[た]べる。|Каждый день ем рис.|еда
飲む|のむ|пить|глагол|水[みず]を飲[の]みます。|Я пью воду.|еда
水|みず|вода|сущ.|水[みず]をください。|Воду, пожалуйста.|еда
学校|がっこう|школа|сущ.|学校[がっこう]に行[い]きます。|Иду в школу.|учёба
先生|せんせい|учитель|сущ.|先生[せんせい]は優[やさ]しいです。|Учитель добрый.|учёба
本|ほん|книга|сущ.|本[ほん]を読[よ]む。|Читаю книгу.|учёба
行く|いく|идти|глагол|駅[えき]へ行[い]く。|Иду на станцию.|путешествия
駅|えき|станция|сущ.|駅[えき]はどこですか。|Где станция?|путешествия
大きい|おおきい|большой|прил.|大[おお]きい犬[いぬ]です。|Это большая собака.|прилагательные
小さい|ちいさい|маленький|прил.|小[ちい]さい猫[ねこ]がいる。|Есть маленькая кошка.|прилагательные
友達|ともだち|друг|сущ.|友達[ともだち]と話[はな]す。|Говорю с другом.|общение
見る|みる|смотреть|глагол|テレビを見[み]る。|Смотрю телевизор.|повседневное
今日|きょう|сегодня|сущ.|今日[きょう]は暑[あつ]いです。|Сегодня жарко.|повседневное
犬|いぬ|собака|сущ.|犬[いぬ]が好[す]きです。|Люблю собак.|повседневное
ありがとう|ありがとう|спасибо|межд.|ありがとうございます。|Большое спасибо.|общение`,
en:`hello|həˈləʊ|привет|межд.|Hello, how are you?|Привет, как дела?|общение
water|ˈwɔːtər|вода|сущ.|Can I have some water?|Можно воды?|еда
book|bʊk|книга|сущ.|I read a book every week.|Я читаю книгу каждую неделю.|учёба
travel|ˈtrævəl|путешествовать|глагол|I love to travel.|Обожаю путешествовать.|путешествия
ticket|ˈtɪkɪt|билет|сущ.|I need a train ticket.|Мне нужен билет на поезд.|путешествия
breakfast|ˈbrekfəst|завтрак|сущ.|We eat breakfast at eight.|Мы завтракаем в восемь.|еда
work|wɜːrk|работа|сущ.|My work starts at nine.|Моя работа начинается в девять.|работа
doctor|ˈdɑːktər|врач|сущ.|I have to see a doctor.|Мне нужно к врачу.|медицина
friend|frend|друг|сущ.|He is my best friend.|Он мой лучший друг.|общение
study|ˈstʌdi|учиться|глагол|I study English every day.|Я учу английский каждый день.|учёба
happy|ˈhæpi|счастливый|прил.|She looks happy today.|Сегодня она выглядит счастливой.|прилагательные
expensive|ɪkˈspensɪv|дорогой|прил.|This hotel is too expensive.|Этот отель слишком дорогой.|прилагательные
ask|æsk|спрашивать|глагол|Can I ask a question?|Можно задать вопрос?|глаголы
buy|baɪ|покупать|глагол|I want to buy some bread.|Хочу купить хлеба.|глаголы
weather|ˈweðər|погода|сущ.|The weather is nice today.|Сегодня хорошая погода.|повседневное`};
const L={en:['English','🇬🇧'],ja:['日本語','🇯🇵']},GN={choice:'Найди перевод',match:'Соедини пары',listen:'Аудирование',build:'Собери предложение',write:'Напиши слово',recall:'Вспомни по подсказке'};
const ST={new:'Новое',learning:'Учу',learned:'Выучено'};
const def=()=>({lang:null,theme:'auto',furi:true,fmode:'always',rate:1,nw:10,rv:50,auto:false,voice:'',data:{en:null,ja:null},streak:0,last:'',lt:0});
let S=def(),SOK=true,T='home',Q=null,G=null,M='',IMP=null,SP=0,SS=0;
try{const x=JSON.parse(localStorage.getItem('kotoba')||'null');if(x)S=Object.assign(def(),x);localStorage.setItem('_t','1')}catch(e){SOK=false}
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip=s=>String(s).replace(/\[[^\]]*\]/g,''),rb=s=>esc(s).replace(/([\u4e00-\u9fff々]+)\[([^\]]+)\]/g,'<ruby>$1<rt>$2</rt></ruby>').replace(/\[[^\]]*\]/g,'');
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const td=(t=Date.now())=>{const d=new Date(t);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const D=()=>S.data[S.lang],W=()=>D().words,RV=w=>S.rev&&Q&&(Q.i+w.id.charCodeAt(0))%2==0,save=()=>{try{localStorage.setItem('kotoba',JSON.stringify(S));if(S.bk!=td()){S.bk=td();localStorage.setItem('kotoba_bak',JSON.stringify(S))}}catch(e){SOK=false}};
const mk=o=>Object.assign({id:uid(),w:'',r:'',t:'',pos:'',ex:'',ext:'',tags:'',lvl:'',due:0,ivl:0,ease:2.5,reps:0,lapses:0,seen:0,ok:0,bad:0,hist:[]},o);
const seed=l=>SEED[l].split('\n').map(x=>{const a=x.split('|');return mk({w:a[0],r:a[1],t:a[2],pos:a[3],ex:a[4],ext:a[5],tags:a[6],lvl:l=='ja'?'N5':'A1'})});
const st=w=>!w.seen?'new':w.ivl>=21?'learned':'learning';
const hasK=s=>/[\u4e00-\u9fff]/.test(s);
const wh=w=>S.lang=='ja'&&w.r&&hasK(w.w)?`<ruby>${esc(w.w)}<rt>${esc(w.r)}</rt></ruby>`:esc(w.w);
function toast(m){const e=$('#t');e.textContent=m;e.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.opacity=0,2800)}
function dayo(){const d=D();if(!d.day||d.day.d!=td())d.day={d:td(),n:0,r:0,ok:0,tot:0,sec:0};return d.day}
/* SM-2 */
function sched(w,g){let e=w.ease,r=w.reps,i=w.ivl,due;if(!g){r=0;i=0;e=Math.max(1.3,e-.2);due=Date.now()+6e5}else{r++;i=r==1?(g==3?3:1):r==2?(g==1?2:g==2?4:6):Math.max(i+1,Math.round(i*(g==1?1.2:g==2?e:e*1.3)));e=Math.max(1.3,e+(g==1?-.15:g==3?.15:0));due=Date.now()+i*864e5}return{ivl:i,ease:e,reps:r,due}}
const lab=s=>s.ivl?s.ivl+' дн.':'10 мин';
function rec(w,g){const dd=dayo(),first=!w.seen,n=Date.now();if(S.lt)dd.sec+=Math.min(30,(n-S.lt)/1000);S.lt=n;
Object.assign(w,sched(w,g),{seen:1});w.hist.push({t:n,g});if(w.hist.length>30)w.hist.shift();
if(g){w.ok++;dd.ok++}else{w.bad++;w.lapses++;if(w.lapses>=8&&!w.sus){w.sus=1;setTimeout(()=>toast('Слово «'+w.w+'» приостановлено: слишком часто забывается'),0)}}dd.tot++;first?dd.n++:dd.r++;
const h=D().hist;h[td()]=(h[td()]||0)+1;if(S.last!=td()){S.streak=S.last==td(n-864e5)?S.streak+1:1;S.last=td()}save()}
function gameRec(w,ok){if(!ok||!w.seen||w.due<=Date.now())rec(w,ok?2:0);else{w.ok++;const d=dayo();d.ok++;d.tot++;save()}}
function queue(){const n=Date.now(),dd=dayo(),ws=W();return{rv:ws.filter(w=>!w.sus&&w.seen&&w.due<=n).sort((a,b)=>a.due-b.due).slice(0,Math.max(0,S.rv-dd.r)),nw:ws.filter(w=>!w.seen).slice(0,Math.max(0,S.nw-dd.n))}}
const probs=()=>W().filter(w=>w.lapses>=2||(w.bad>=2&&w.bad>w.ok)).sort((a,b)=>b.lapses-a.lapses);
/* Озвучка */
function voices(){return 'speechSynthesis' in window?speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith(S.lang)):[]}
function speak(t){if(!('speechSynthesis' in window)){toast('Браузер не поддерживает озвучку');return}const v=voices();if(!v.length){toast('Нет '+(S.lang=='ja'?'японского':'английского')+' голоса в этом браузере или на устройстве');return}
const u=new SpeechSynthesisUtterance(strip(t));u.voice=v.find(x=>x.name==S.voice)||v[0];u.lang=u.voice.lang;u.rate=S.rate;speechSynthesis.cancel();speechSynthesis.speak(u)}
const sw=w=>speak(S.lang=='ja'&&w.r?w.r:w.w);
if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=()=>{if(T=='set')render()};
/* Импорт */
const KEYS={w:['w','word','слово'],r:['r','reading','чтение','ipa','транскрипция'],t:['t','translation','перевод'],pos:['pos','часть речи'],ex:['ex','example','пример'],ext:['ext','перевод примера'],tags:['tags','тема','теги'],lvl:['lvl','level','уровень']};
function norm0(o){const r={};for(const k in KEYS){const f=Object.keys(o).find(x=>KEYS[k].includes(x.trim().toLowerCase()));r[k]=f?String(o[f]==null?'':o[f]).trim():''}return r}
function parseCSV(t){const rows=[];let r=[],c='',q=0;const l=t.split('\n')[0],d=l.split(';').length>l.split(',').length?';':',';
for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h=='"'){if(t[i+1]=='"'){c+='"';i++}else q=0}else c+=h}else if(h=='"')q=1;else if(h==d){r.push(c);c=''}else if(h=='\n'||h=='\r'){if(h=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';rows.push(r);r=[]}else c+=h}
if(c||r.length){r.push(c);rows.push(r)}return rows.filter(r=>r.some(x=>x.trim()))}
function parseImp(txt){let items=[];txt=txt.replace(/^\uFEFF/,'');
if(/^\s*[\[{]/.test(txt)){const j=JSON.parse(txt);items=(Array.isArray(j)?j:j.words||[]).map(norm0)}
else{const rows=parseCSV(txt),h=rows[0].map(x=>x.trim().toLowerCase()),isH=h.some(x=>KEYS.w.includes(x));const hd=isH?rows.shift():['w','r','t','pos','ex','ext','tags','lvl'];items=rows.map(r=>{const o={};hd.forEach((k,i)=>o[k]=r[i]);return norm0(o)})}
const ok=[],err=[],ex=new Map(W().map(w=>[w.w.toLowerCase(),w]));let dup=0;
items.forEach((x,i)=>{if(!x.w||!x.t)err.push('запись '+(i+1)+': нет слова или перевода');else{if(ex.has(x.w.toLowerCase()))dup++;ok.push(x)}});return{ok,err,dup,mode:'skip'}}
function doImport(){const ex=new Map(W().map(w=>[w.w.toLowerCase(),w]));let a=0,u=0,s=0;
IMP.ok.forEach(x=>{const d=ex.get(x.w.toLowerCase());if(d&&IMP.mode=='skip'){s++;return}if(d&&IMP.mode=='upd'){for(const k in x)if(x[k])d[k]=x[k];u++;return}W().push(mk(x));a++});save();toast(`Добавлено ${a}, обновлено ${u}, пропущено ${s}`);IMP=null;M=''}
/* Представления */
function chooser(){return `<main><h2 style="font-size:32px;margin-top:40px">Kotoba 🌿</h2><p class=mu>Выберите язык обучения. Прогресс каждого языка хранится отдельно.</p>${SOK?'':'<div class=warn>Хранилище браузера недоступно: прогресс не сохранится после закрытия. Делайте резервные копии.</div>'}${['en','ja'].map(l=>`<button class="btn2" style="font-size:20px;padding:22px" onclick="pick('${l}')">${L[l][1]} ${L[l][0]}${S.data[l]?`<small class=mu> · слов: ${S.data[l].words.length}</small>`:''}</button>`).join('')}</main>`}
function pick(l){S.lang=l;if(!S.data[l])S.data[l]={words:seed(l),games:[],day:null,hist:{}};save();T='home';Q=G=null;render()}
function home(){const ws=W(),q=queue(),dd=dayo(),lr=ws.filter(w=>st(w)=='learned').length,done=dd.n+dd.r,rem=q.rv.length+q.nw.length,pc=done+rem?Math.round(done/(done+rem)*100):0;
const wi=ws.filter(w=>w.ex),sd=wi.length?wi[[...td()].reduce((a,c)=>a+c.charCodeAt(0),0)%wi.length]:null;
return `<div class=grid>${[['Слов',ws.length,'all'],['Новых',ws.filter(w=>!w.seen).length,'new'],['Повторить',q.rv.length,'due'],['Выучено',lr,'learned'],['В процессе',ws.length-lr-ws.filter(w=>!w.seen).length,'learning'],['Серия 🔥',S.streak,'']].map(x=>`<div class=tile ${x[2]?`onclick="A('wl','${x[2]}')" style="cursor:pointer"`:''}><b>${x[1]}</b><span class=mu>${x[0]}</span></div>`).join('')}</div>
<div class=card><b>Сегодня: ${done} из ${done+rem}</b><div class=bar><i style="width:${pc}%"></i></div><button class=btn onclick="A('study')">Начать обучение</button>
<div class=row><button class=btn2 onclick="A('study','r')">Повторение (${q.rv.length})</button><button class=btn2 onclick="A('study','n')">Новые (${q.nw.length})</button></div></div>
${sd?`<div class=card><span class=mu>Предложение дня</span><div style="font-size:20px;margin:6px 0">${rb(sd.ex)}</div><div class=mu>${esc(sd.ext)}</div><div class=row><button class=ic onclick="A('sayx','${sd.id}')">🔊</button><button class=ic onclick="A('tab','sent')">Тренировать предложения</button></div></div>`:''}
<b>Быстрые игры</b><div class=row><button class=btn2 onclick="gstart('choice')">Перевод</button><button class=btn2 onclick="gstart('listen')">Аудирование</button><button class=btn2 onclick="gstart('write')">Писать</button></div>`}
function sent(){const l=W().filter(w=>w.ex);if(!l.length)return '<p>Нет предложений. Добавьте слова с примерами.</p>';const w=l[SP%l.length];
return `<h2>Предложения</h2><div class=card><div class=big style="font-size:26px">${rb(w.ex)}</div><button class=ic onclick="A('sayx','${w.id}')">🔊</button>${SS?`<p>${esc(w.ext)}</p>`:'<button class=btn2 onclick="A(\'sshow\')">Показать перевод</button>'}<p class=mu>Ключевое слово: <b>${wh(w)}</b> — ${esc(w.t)}${w.pos?' ('+esc(w.pos)+')':''}</p><p class=mu>Прослушайте и повторите вслух.</p></div><button class=btn onclick="A('snext')">Следующее предложение</button>`}
function cards(){if(!Q){const q=queue();return `<h2>Карточки</h2><div class=card><p>Повторить: <b>${q.rv.length}</b> · Новые: <b>${q.nw.length}</b></p>${q.rv.length+q.nw.length?`<button class=btn onclick="A('study')">Начать</button>`:'<p class=mu>На сегодня всё. Можно взять ещё новые слова или изменить лимиты в настройках.</p>'}<button class=btn2 onclick="A('study','x')">Ещё 5 новых слов</button></div>`}
